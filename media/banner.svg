<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Browser: A real web page on your canvas, at any device's size.">
  <defs>
    <radialGradient id="glow" cx="0.18" cy="0.22" r="0.65">
      <stop offset="0" stop-color="#22b8cf" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#22b8cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#22b8cf" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22b8cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22b8cf"/>
      <stop offset="1" stop-color="#22b8cf" stop-opacity="0.65"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="screen"><rect width="540" height="404" rx="0"/></clipPath>
  </defs>
  <rect width="1280" height="640" fill="#0c0f15"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <g transform="translate(88 82)">
    <rect width="104" height="104" rx="26" fill="url(#tile)"/>
    <rect width="104" height="104" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
    <g transform="translate(22 22)"><g transform="scale(2.5)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g></g>
  </g>
  <text x="84" y="266" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-1.5" fill="#f4f6fb">Browser</text>
  <text x="88" y="326" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="29" fill="#9aa3b6">A real web page on your canvas, at</text>
  <text x="88" y="366" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="29" fill="#9aa3b6">any device's size.</text>
  <g transform="translate(0 414)"><g transform="translate(88 0)"><rect width="99" height="38" rx="19" fill="#22b8cf" fill-opacity="0.12" stroke="#22b8cf" stroke-opacity="0.45"/><text x="49.5" y="25" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f4f6fb">Devices</text></g><g transform="translate(197 0)"><rect width="118" height="38" rx="19" fill="#22b8cf" fill-opacity="0.12" stroke="#22b8cf" stroke-opacity="0.45"/><text x="59" y="25" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f4f6fb">Bookmarks</text></g><g transform="translate(325 0)"><rect width="109" height="38" rx="19" fill="#22b8cf" fill-opacity="0.12" stroke="#22b8cf" stroke-opacity="0.45"/><text x="54.5" y="25" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f4f6fb">DevTools</text></g><g transform="translate(444 0)"><rect width="118" height="38" rx="19" fill="#22b8cf" fill-opacity="0.12" stroke="#22b8cf" stroke-opacity="0.45"/><text x="59" y="25" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f4f6fb">localhost</text></g></g>
