    <g transform="translate(90 15)"><g transform="scale(0.9166666666666666)" fill="none" stroke="#22b8cf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g></g>
    <text x="120" y="32" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f4f6fb">Browser</text>
    <g transform="translate(0 52)" clip-path="url(#screen)"><g font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="12">
